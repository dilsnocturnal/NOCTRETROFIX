<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: ruang gelap fotografer. Kanvas besar di kiri dan panel gaya Lightroom di kanan.
   Di HP kanvas menempel di atas, panel bergulir di bawahnya. Satu tema gelap, dipilih sengaja. */
:root {
  color-scheme: dark;
  --bg: #171512;
  --panel: #201D1A;
  --panel-2: #2A2622;
  --line: #3A352F;
  --ink: #EFE7D8;
  --muted: #A39A8B;
  --accent: #F2B230;
  --accent-ink: #1B1305;
  --danger: #E0573D;
  --font-display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding-top: 8px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: .02em; line-height: 1; }
.logo i { font-style: normal; color: var(--accent); }
.top-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 13px; line-height: 1.1; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.icon { padding: 8px 10px; font-size: 16px; }
.btn.small { padding: 6px 10px; font-size: 12px; }
select.btn { padding-right: 6px; }

.work { min-height: 0; display: grid; gap: 10px; grid-template-rows: minmax(190px, 40%) minmax(0, 1fr); padding-bottom: 8px; }
@media (min-width: 900px) { .work { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr); } }

.stage { position: relative; min-height: 0; min-width: 0; background: #0E0D0B; border: 1px solid var(--line); border-radius: 10px; display: grid; padding: 10px; }
#view { width: 100%; height: 100%; object-fit: contain; display: block; min-height: 0; }
.stage-bar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; pointer-events: none; }
.stage-bar > * { pointer-events: auto; }
.badge { background: rgba(23, 21, 18, .86); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: 70%; }
.hold { background: rgba(23, 21, 18, .86); user-select: none; touch-action: none; }
.drop { position: absolute; inset: 0; border: 2px dashed var(--accent); border-radius: 10px; display: grid; place-items: center; background: rgba(23, 21, 18, .7); font-weight: 700; pointer-events: none; }

.side { min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
.histwrap { padding: 10px 12px 6px; display: grid; gap: 4px; }
.histrow { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
#hist { width: 100%; height: 56px; background: #12100E; border-radius: 6px; display: block; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.panes { overflow-y: auto; min-height: 0; padding: 4px 12px 24px; }
.pane { display: grid; gap: 12px; padding-top: 10px; align-content: start; }
.h { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.h:first-child { border-top: 0; margin-top: 0; padding-top: 0; }

.sl { display: grid; gap: 2px; }
.sl-top { display: flex; justify-content: space-between; gap: 8px; }
.sl-top label { font-size: 12.5px; color: var(--ink); }
.sl-top output { font-family: var(--font-mono); font-size: 12px; color: var(--accent); min-width: 44px; text-align: right; cursor: pointer; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--line); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: var(--line); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ink); border: 0; margin-top: -6px; }
input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--ink); border: 0; }
input[type="range"].hue::-webkit-slider-runnable-track { background: linear-gradient(90deg, hsl(0,80%,55%), hsl(60,80%,55%), hsl(120,80%,55%), hsl(180,80%,55%), hsl(240,80%,55%), hsl(300,80%,55%), hsl(360,80%,55%)); }
input[type="range"].hue::-moz-range-track { background: linear-gradient(90deg, hsl(0,80%,55%), hsl(60,80%,55%), hsl(120,80%,55%), hsl(180,80%,55%), hsl(240,80%,55%), hsl(300,80%,55%), hsl(360,80%,55%)); }
@media (pointer: coarse) { input[type="range"] { height: 30px; } .btn { padding: 10px 12px; } .btn.small { padding: 8px 10px; } }

.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pre { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 4px 6px; display: grid; gap: 4px; text-align: center; }
.pre canvas { width: 100%; aspect-ratio: 3 / 2; border-radius: 5px; display: block; background: #12100E; }
.pre span { font-size: 11.5px; font-weight: 600; line-height: 1.15; }
.pre[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.pre[aria-pressed="true"] span { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.band { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
.band[aria-pressed="true"] { border-color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--font-mono); }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.note { color: var(--muted); font-size: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; max-width: 92vw; text-align: center; }
.busy { position: fixed; inset: 0; z-index: 50; background: rgba(23, 21, 18, .78); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); font-size: 18px; }
</style>

<div class="app">
  <header class="top">
    <div class="logo" aria-label="NOCT titik RETRO">NOCT<i>.</i>RETRO</div>
    <div class="top-actions">
      <button class="btn icon" id="btnUndo" aria-label="Urungkan" title="Urungkan" disabled>&#8630;</button>

      <button class="btn" id="btnOpen">Buka foto</button>
      <button class="btn" id="btnCam">Ambil foto</button>

      <button class="btn primary" id="btnSave">Simpan</button>
    </div>
  </header>

  <main class="work">
    <section class="stage" id="stage" aria-label="Pratinjau foto">
      <canvas id="view" width="16" height="16"></canvas>
      <div class="stage-bar">

    <aside class="side">
      <div class="histwrap">

        <canvas id="hist" width="256" height="56"></canvas>
      </div>
      <div class="tabs" role="tablist" aria-label="Panel penyuntingan">
        <button class="tab" role="tab" data-tab="filter" aria-selected="true">Filter</button>
        <button class="tab" role="tab" data-tab="light" aria-selected="false">Cahaya</button>
        <button class="tab" role="tab" data-tab="color" aria-selected="false">Warna</button>
        <button class="tab" role="tab" data-tab="fx" aria-selected="false">Efek</button>
        <button class="tab" role="tab" data-tab="crop" aria-selected="false">Potong</button>
      </div>
      <div class="panes">
        <div class="pane" id="pane-filter"></div>
        <div class="pane" id="pane-light" hidden></div>
        <div class="pane" id="pane-color" hidden></div>
        <div class="pane" id="pane-fx" hidden></div>
        <div class="pane" id="pane-crop" hidden></div>
      </div>
    </aside>
  </main>
</div>

<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<div class="busy" id="busy" hidden><span id="busyText">Memproses…</span></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    var work = mk(W, H), wx = work.getContext('2d');
    wx.putImageData(out, 0, 0); drawStamp(wx, W, H, P);
    var fin = mk(W, H); composeInto(fin, work, P);
    return toBlob(fin, png ? 'image/png' : 'image/jpeg', 0.92);
  }
  async function saveImage() {
    if (!ST.src) return;
    var png = $('fmt').value === 'png';
    setBusy(true, 'Menyimpan foto…'); await tick();
    try {
      var blob = await exportBlob(png);
      var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
      var name = 'noct-retro-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + (png ? '.png' : '.jpg');
      setBusy(false);
      if (dl) await dl.save({ filename: name, data: blob });
      else {
        var url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
      toast('Foto disimpan');
    } catch (e) {
      setBusy(false);
      if (!e || e.code !== 'declined') toast('Foto tidak bisa disimpan di sini.');
    }
  }

  /* ---------- pasang ---------- */
  buildUI();
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
  $('btnOpen').addEventListener('click', function () { $('fileIn').click(); });
  $('btnCam').addEventListener('click', function () { $('camIn').click(); });
  $('fileIn').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
  $('camIn').addEventListener('change', function (e) { loadFile(e.target.files[0]); e.target.value = ''; });
  $('btnSave').addEventListener('click', saveImage);
  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  var hold = $('btnHold');
  function holdOn(e) { if (e) e.preventDefault(); ST.compare = true; renderNow(); }
  function holdOff() { if (!ST.compare) return; ST.compare = false; renderNow(); }
  hold.addEventListener('pointerdown', holdOn); hold.addEventListener('pointerup', holdOff);
  hold.addEventListener('pointerleave', holdOff); hold.addEventListener('pointercancel', holdOff);
  document.addEventListener('keydown', function (e) {
    if (e.key === '\\' && !e.repeat) holdOn(e);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  });
  document.addEventListener('keyup', function (e) { if (e.key === '\\') holdOff(); });
  var stage = $('stage'), dragN = 0;
  stage.addEventListener('dragenter', function (e) { e.preventDefault(); dragN++; $('drop').hidden = false; });
  stage.addEventListener('dragover', function (e) { e.preventDefault(); });
  stage.addEventListener('dragleave', function () { dragN = Math.max(0, dragN - 1); if (!dragN) $('drop').hidden = true; });
  stage.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('drop').hidden = true; if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  var sc = sampleCanvas();
  setSource(sc, sc.width, sc.height, true);
  choosePreset('kodak');
  try { if (document.fonts && document.fonts.load) document.fonts.load('500 20px "DM Mono"').then(schedule); } catch (e) {}
  try {
    if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { dl = d; }).catch(function () {});
  } catch (e) {}
})();
</script>
